<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Tipo Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Estilos personalizados (iguales que antes) */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1e293b; /* Gray 800 */
            color: #f8fafc; /* Gray 50 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem; /* Espacio alrededor del contenido en móviles */
        }

        .card {
            background-color: #334155; /* Gray 700 */
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%; /* Ocupar todo el ancho en móviles */
            max-width: 48rem; /* Ancho máximo */
        }

        .heading {
            color: #94a3b8; /* Gray 400 */
            font-size: 1.5rem; /* Ajuste para pantallas pequeñas */
        }

        .label {
            color: #94a3b8; /* Gray 400 */
            font-size: 0.875rem; /* Ajuste para pantallas pequeñas */
        }

        input, select {
            background-color: #475569; /* Gray 600 */
            color: #f8fafc; /* Gray 50 */
            border-radius: 0.375rem; /* Ajuste para pantallas pequeñas */
            padding: 0.5rem 0.75rem; /* Padding consistente */
        }
        /* Estilo específico para el input numérico */
        input[type=number] {
             appearance: textfield; /* Oculta flechas en algunos navegadores */
             -moz-appearance: textfield; /* Firefox */
        }

        .btn-primary {
            background-color: #14b8a6; /* Teal 500 */
            color: #f8fafc; /* Gray 50 */
            transition: background-color 0.3s ease;
            font-size: 0.875rem; /* Ajuste para pantallas pequeñas */
            padding: 0.75rem 1.5rem; /* Ajuste para pantallas pequeñas */
        }
         .btn-primary:disabled { /* Estilo para botón deshabilitado */
             background-color: #52525b; /* zinc-600 */
             cursor: not-allowed;
             opacity: 0.7;
        }

        .btn-primary:hover:not(:disabled) { /* Hover solo si no está deshabilitado */
            background-color: #0d9488; /* Teal 600 */
        }


        .respuesta {
            background-color: #475569; /* Gray 600 */
            color: #f8fafc; /* Gray 50 */
            transition: background-color 0.3s ease;
            font-size: 0.875rem; /* Ajuste para pantallas pequeñas */
            padding: 0.75rem; /* Ajuste para pantallas pequeñas */
            border-radius: 0.375rem; /* Ajuste para pantallas pequeñas */
            border: 1px solid #475569; /* Borde sutil para mejor definición */
            cursor: pointer;
        }
        .respuesta:not(:disabled):hover { /* Hover solo si no está deshabilitado */
             background-color: #64748b;  /* Gray 500 */
             border-color: #94a3b8; /* Gray 400 */
        }
        .respuesta:disabled { /* Estilo para botones deshabilitados */
             opacity: 0.6;
             cursor: not-allowed;
        }

        .marcador {
            color: #94a3b8; /* Gray 400 */
            font-size: 0.875rem; /* Ajuste para pantallas pequeñas */
            margin-bottom: 0.75rem; /* Margen inferior */
        }

        .btn-verde {
            background-color: #22c55e !important; /* Green 500 con !important para sobreescribir */
            border-color: #16a34a !important; /* Borde más oscuro */
        }
        .btn-rojo {
            background-color: #ef4444 !important; /* Red 500 con !important */
            border-color: #dc2626 !important; /* Borde más oscuro */
        }

        #barraProgreso {
            background-color: #4a5568; /* Gray 700 */
            border-radius: 0.375rem; /* Ajuste para pantallas pequeñas */
            overflow: hidden;
        }

        #progreso {
            background-color: #14b8a6; /* Teal 500 */
            height: 0.5rem; /* Ajuste para pantallas pequeñas */
            border-radius: 0.375rem; /* Ajuste para pantallas pequeñas */
            width: 0;
            transition: width 0.5s ease-in-out;
        }

        #resultado {
            background-color: #475569; /* Gray 600 */
            border: 1px solid #64748b; /* Gray 500 */
        }
    </style>
</head>
<body class="p-4">
    <div class="mx-auto max-w-md md:max-w-2xl"> <!-- Este contenedor controla el ancho -->
        <div class="card p-6 md:p-8"> <!-- Ajustado padding para móviles -->
            <!-- Título Cambiado -->
            <h1 class="text-2xl md:text-3xl font-semibold text-center heading mb-6">Configuración del examen tipo test</h1>

            <!-- Contenedor de la configuración -->
            <div id="configuracion" class="mb-6 space-y-4">
                <div>
                    <label for="selectBloque" class="block text-sm font-bold label mb-2">Selecciona Bloque:</label>
                    <select id="selectBloque" class="shadow appearance-none border rounded w-full leading-tight focus:outline-none focus:shadow-outline">
                        <option value="TODOS">TODOS LOS BLOQUES</option>
                        <!-- Opciones de bloque se llenarán dinámicamente -->
                    </select>
                </div>

                <div>
                    <label for="selectTema" class="block text-sm font-bold label mb-2">Selecciona Tema:</label>
                    <select id="selectTema" class="shadow appearance-none border rounded w-full leading-tight focus:outline-none focus:shadow-outline">
                        <option value="TODOS">TODOS LOS TEMAS</option>
                        <!-- Opciones de tema se llenarán dinámicamente -->
                    </select>
                </div>

                <div>
                    <label for="numPreguntas" class="block text-sm font-bold label mb-2">Número de preguntas:</label>
                    <!-- Eliminado value="5" -->
                    <input type="number" id="numPreguntas" min="1" class="shadow appearance-none border rounded w-full leading-tight focus:outline-none focus:shadow-outline">
                    <p id="maxPreguntasInfo" class="text-xs text-gray-400 mt-1"></p> <!-- Info preguntas disponibles -->
                </div>

                <div>
                    <label for="dificultad" class="block text-sm font-bold label mb-2">Dificultad (penalización por fallo):</label>
                    <select id="dificultad" class="shadow appearance-none border rounded w-full leading-tight focus:outline-none focus:shadow-outline">
                        <option value="normal">Normal (0 puntos)</option>
                        <option value="penaliza_05">Difícil (-0.5 puntos)</option>
                        <option value="penaliza_1">Jodido (-1 punto)</option>
                    </select>
                </div>

                <button id="btnComenzar" class="btn-primary font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full mt-4">Comenzar Examen</button>
            </div>

            <!-- Contenedor del examen (sin cambios aquí) -->
            <div id="examen" class="p-4" style="display: none;">
                <div class="marcador grid grid-cols-3 gap-2 text-center mb-4">
                     <div>Correctas: <span id="correctas" class="font-bold text-green-400">0</span></div>
                     <div>Falladas: <span id="falladas" class="font-bold text-red-400">0</span></div>
                     <div>Puntuación: <span id="puntuacion" class="font-bold text-teal-400">0</span></div>
                 </div>

                <div id="barraProgreso" class="mb-4">
                    <div id="progreso"></div>
                </div>

                <div id="tema" class="text-sm text-gray-400 mb-2 text-center italic"></div>
                <div id="pregunta" class="text-lg md:text-xl mb-4 font-semibold text-center"></div>
                <div id="respuestas" class="grid gap-3 md:gap-4 mt-4">
                    <button class="respuesta font-bold py-3 px-4 rounded text-left" data-index="0"></button>
                    <button class="respuesta font-bold py-3 px-4 rounded text-left" data-index="1"></button>
                    <button class="respuesta font-bold py-3 px-4 rounded text-left" data-index="2"></button>
                </div>

                 <div id="resultado" class="mt-6 p-4 rounded" style="display: none;">
                    <p id="mensajeResultado" class="font-bold text-lg text-center"></p>
                    <p id="explicacion" class="text-gray-300 italic mt-2 text-sm"></p>
                 </div>

                <div class="flex justify-center mt-6">
                     <button id="btnSiguiente" class="btn-primary font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline" style="display: none;">Siguiente Pregunta</button>
                     <button id="btnVerResultados" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline" style="display: none;">Ver Resultados</button>
                </div>
            </div>

            <!-- Contenedor del resultado final (sin cambios aquí) -->
            <div id="resultadoFinal" class="p-4 text-center" style="display: none;">
                <p id="mensajeFinal" class="text-xl mb-4"></p>
                <button id="btnReiniciar" class="btn-primary font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mt-4">Nuevo Test</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

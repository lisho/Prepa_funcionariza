<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Tipo Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Estilos personalizados */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1e293b; /* Gray 800 */
            color: #f8fafc; /* Gray 50 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem; /* Espacio alrededor del contenido en móviles */
        }

        .card {
            background-color: #334155; /* Gray 700 */
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%; /* Ocupar todo el ancho en móviles */
            max-width: 48rem; /* Ancho máximo */
        }

        .heading {
            color: #94a3b8; /* Gray 400 */
            font-size: 1.5rem; /* Ajuste para pantallas pequeñas */
        }

        .label {
            color: #94a3b8; /* Gray 400 */
            font-size: 0.875rem; /* Ajuste para pantallas pequeñas */
        }

        input, select {
            background-color: #475569; /* Gray 600 */
            color: #f8fafc; /* Gray 50 */
            border-radius: 0.375rem; /* Ajuste para pantallas pequeñas */
        }

        .btn-primary {
            background-color: #14b8a6; /* Teal 500 */
            color: #f8fafc; /* Gray 50 */
            transition: background-color 0.3s ease;
            font-size: 0.875rem; /* Ajuste para pantallas pequeñas */
            padding: 0.75rem 1.5rem; /* Ajuste para pantallas pequeñas */
        }

        .btn-primary:hover {
            background-color: #0d9488; /* Teal 600 */
        }

        .respuesta {
            background-color: #475569; /* Gray 600 */
            color: #f8fafc; /* Gray 50 */
            transition: background-color 0.3s ease;
            font-size: 0.875rem; /* Ajuste para pantallas pequeñas */
            padding: 0.75rem; /* Ajuste para pantallas pequeñas */
            border-radius: 0.375rem; /* Ajuste para pantallas pequeñas */
        }

        .respuesta:hover {
            /*background-color: #64748b;  Gray 500 */
        }

        .marcador {
            color: #94a3b8; /* Gray 400 */
            font-size: 0.875rem; /* Ajuste para pantallas pequeñas */
            margin-bottom: 0.75rem; /* Margen inferior */
        }

        .btn-verde {
            background-color: #22c55e; /* Green 500 */
        }
        .btn-rojo {
            background-color: #ef4444; /* Red 500 */
        }   

        #barraProgreso {
            background-color: #4a5568; /* Gray 700 */
            border-radius: 0.375rem; /* Ajuste para pantallas pequeñas */
            overflow: hidden;
        }

        #progreso {
            background-color: #14b8a6; /* Teal 500 */
            height: 0.5rem; /* Ajuste para pantallas pequeñas */
            border-radius: 0.375rem; /* Ajuste para pantallas pequeñas */
            width: 0;
            transition: width 0.5s ease-in-out;
        }
        
        #resultado {
            background-color: #475569;
        }
    </style>
</head>
<body class="p-4">
    <div class="mx-auto max-w-md md:max-w-2xl"> <!-- Este contenedor controla el ancho -->
        <div class="card p-8">
            <h1 class="text-3xl font-semibold text-center heading mb-6">Examen Tipo Test</h1>

            <!-- Contenedor de la configuración -->
            <div id="configuracion" class="mb-6">
                <label for="numPreguntas" class="block text-sm font-bold label mb-2">Número de preguntas:</label>
                <input type="number" id="numPreguntas" min="1" value="5" class="shadow appearance-none border rounded w-full py-2 px-3 leading-tight focus:outline-none focus:shadow-outline">

                <label for="dificultad" class="block text-sm font-bold label mb-2">Dificultad:</label>
                <select id="dificultad" class="shadow appearance-none border rounded w-full py-2 px-3 leading-tight focus:outline-none focus:shadow-outline">
                    <option value="normal">Normal</option>
                    <option value="penaliza_05">Penaliza -0.5</option>
                    <option value="penaliza_1">Penaliza -1</option>
                </select>

                <button id="btnComenzar" class="btn-primary font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full mt-4">Comenzar Examen</button>
            </div>

            <!-- Contenedor del examen -->
            <div id="examen" class="p-4">
                <div class="marcador">
                    Puntuación: <span id="puntuacion">0</span><br>
                    Correctas: <span id="correctas">0</span><br>
                    Falladas: <span id="falladas">0</span>
                </div>

                <div id="barraProgreso" class="mb-4">
                    <div id="progreso"></div>
                </div>

                <div id="tema" class="text-2xl mb-4"></div>
                <div id="pregunta" class="text-xl mb-4"></div>
                 <!-- <div id="respuestas" class="grid grid-cols-2 gap-4"> -->
                <div id="respuestas" class="grid gap-4">
                    <button class="respuesta font-bold py-4 px-6 rounded focus:outline-none focus:shadow-outline text-left" data-index="0"></button>
                    <button class="respuesta font-bold py-4 px-6 rounded focus:outline-none focus:shadow-outline text-left" data-index="1"></button>
                    <button class="respuesta font-bold py-4 px-6 rounded focus:outline-none focus:shadow-outline text-left" data-index="2"></button>
                    <!-- <button class="respuesta font-bold py-4 px-6 rounded focus:outline-none focus:shadow-outline text-left" data-index="3"></button> -->
                </div>

                <div id="resultado" class="mt-6 p-4 rounded">
                    <p id="mensajeResultado" class="font-bold text-lg"></p>
                    <p id="explicacion" class="text-gray-300 italic"></p>
                </div>
                <button id="btnSiguiente" class="btn-primary font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mt-4">Siguiente Pregunta</button>
                <button id="btnVerResultados" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mt-4" style="display: none;">Ver Resultados</button>
            </div>

            <!-- Contenedor del resultado final -->
            <div id="resultadoFinal" class="p-4 text-center">
                <p id="mensajeFinal" class="text-xl mb-4"></p>
                <button id="btnReiniciar" class="btn-primary font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mt-4">Nuevo Test</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
